// Use the office's time zone so everyone sees the same joke each day.
const timeZone = "America/New_York";
const datePartsFormatter = new Intl.DateTimeFormat("en-US", {
  timeZone, year: "numeric", month: "2-digit", day: "2-digit"
});
const displayDateFormatter = new Intl.DateTimeFormat("en-US", {
  timeZone, weekday: "long", month: "long", day: "numeric", year: "numeric"
});
let displayedDay = "";
function getDailyJoke(now) {
  const parts = {};
  datePartsFormatter.formatToParts(now).forEach(part => {
    parts[part.type] = part.value;
  });
  const key = `${parts.year}-${parts.month}-${parts.day}`;
  // Count calendar days, avoiding daylight-saving time skips or repeats.
  const day = Math.floor(Date.UTC(Number(parts.year), Number(parts.month)-1, Number(parts.day)) / 86400000);
  const index = ((day % jokes.length) + jokes.length) % jokes.length;
  return { key, index, joke: jokes[index] };
}
function showTodaysJoke() {
  const now = new Date();
  const daily = getDailyJoke(now);
  if (daily.key === displayedDay) return;
  displayedDay = daily.key;
  document.getElementById("setup").textContent = daily.joke.setup;
  document.getElementById("punchline").textContent = daily.joke.punchline;
  document.getElementById("date").textContent = displayDateFormatter.format(now);
}
showTodaysJoke();
// Update at midnight even when someone leaves the page open.
setInterval(showTodaysJoke, 1000);
document.addEventListener("visibilitychange", showTodaysJoke);
